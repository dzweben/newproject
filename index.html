<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atoms to Cities</title>
<link rel="icon" href="data:,">
<meta name="description" content="Particles that climb from atoms to cities, driven by the music you play.">
<style>
:root{color-scheme:dark;--ink:#e9edf7;--dim:#8a93a8;--glass:rgba(10,12,22,.55);--line:rgba(255,255,255,.14);--gold:#ffcf7a;--cyan:#7fd8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03040a;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));pointer-events:none}
h1{margin:0;font-size:13px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;opacity:.85}
.caption{position:fixed;left:0;right:0;top:16%;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.6s ease;padding:0 16px}
.caption.on{opacity:1}
.caption b{display:block;font:300 clamp(34px,7vw,88px)/1.05 Georgia,"Times New Roman",serif;letter-spacing:.02em;text-shadow:0 0 32px rgba(127,216,255,.35)}
.caption span{display:block;margin-top:10px;color:var(--dim);letter-spacing:.3em;text-transform:uppercase;font-size:12px}
.hint{position:fixed;left:0;right:0;top:calc(52px + env(safe-area-inset-top,0px));margin:0;text-align:center;color:var(--dim);pointer-events:none;padding:0 24px}
.hint[hidden]{display:none}
.hint.err{color:#ff9a9a}
.dock{position:fixed;left:0;right:0;bottom:0;padding:28px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(3,4,10,0),rgba(3,4,10,.9) 45%)}
.meter{position:relative;height:3px;background:var(--line);border-radius:2px;margin-bottom:12px}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));border-radius:2px;box-shadow:0 0 12px rgba(127,216,255,.6)}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:0 0 14px;padding:0;list-style:none;color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stages li{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .6s}
.stages li.done{color:var(--ink)}
.stages li.on{color:var(--gold)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.now{flex:1 1 180px;min-width:0}
#now{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#credit{display:block;color:var(--dim);font-size:12px}
.tracks{display:flex;flex-wrap:wrap;gap:8px}
button,.btn{font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button:hover,.btn:hover{border-color:rgba(255,255,255,.4)}
button:focus-visible,.btn:focus-within{outline:2px solid var(--cyan);outline-offset:2px}
button[disabled]{opacity:.4;cursor:default}
button.on{border-color:var(--gold);color:var(--gold)}
.round{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:15px}
.btn{position:relative;display:inline-block}
.btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
@media (max-width:560px){.stages{display:none}}
@media (prefers-reduced-motion:reduce){.caption{transition:none}}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<header class="top"><h1>Atoms to Cities</h1></header>
<div id="caption" class="caption" aria-live="polite"><b></b><span></span></div>
<p id="hint" class="hint">Pick a track below, or drop an MP3 anywhere on the page.</p>
<p id="nogl" class="hint err" hidden></p>
<section class="dock" aria-label="Music controls">
  <div class="meter" aria-hidden="true"><div id="fill"></div></div>
  <ol class="stages" id="stages"></ol>
  <div class="row">
    <button id="toggle" class="round" type="button" aria-label="Play" disabled>&#9654;</button>
    <div class="now"><span id="now">No track yet</span><small id="credit"></small></div>
    <div class="tracks" id="tracks"></div>
    <label class="btn">Your MP3<input id="file" type="file" accept="audio/*"></label>
  </div>
</section>
<script>
(() => {
'use strict';

const TAU = Math.PI * 2;
const PHI = (1 + Math.sqrt(5)) / 2;
const STAGES = ['Atoms', 'Shapes', 'Galaxies', 'The Universe', 'Civilizations', 'Cities'];
const TRACKS = [
  { short: 'Moonlight', title: 'Beethoven: Moonlight Sonata', src: 'assets/music/moonlight-sonata.mp3', credit: 'Public domain. Internet Archive.' },
  { short: 'Requiem', title: 'Mozart: Requiem, Dies irae', src: 'assets/music/mozart-requiem-dies-irae.mp3', credit: 'CC0. Internet Archive.' },
  { short: 'Brandenburg', title: 'Bach: Brandenburg Concerto No. 2', src: 'assets/music/bach-brandenburg-2.mp3', credit: 'Public domain. Internet Archive.' },
];
const N = (matchMedia('(max-width: 700px)').matches || (navigator.hardwareConcurrency || 8) <= 4) ? 30000 : 70000;
const SPRING = 3.2, DAMP = 3.4;

const $ = (s) => document.querySelector(s);
const canvas = $('#scene'), hint = $('#hint'), nowEl = $('#now'), creditEl = $('#credit');
const captionEl = $('#caption'), fillEl = $('#fill'), toggleBtn = $('#toggle');
const stageList = $('#stages'), tracksEl = $('#tracks'), fileInput = $('#file');

function showHint(text) { hint.textContent = text; hint.hidden = false; }
function showError(text) { const e = $('#nogl'); e.textContent = text; e.hidden = false; hint.hidden = true; }

/* ---------- geometry helpers ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
function edgesOf(V) {
  let mn = Infinity;
  for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) mn = Math.min(mn, dist(V[i], V[j]));
  const E = [];
  for (let i = 0; i < V.length; i++) for (let j = i + 1; j < V.length; j++) if (Math.abs(dist(V[i], V[j]) - mn) < 1e-6) E.push([i, j]);
  return E;
}

/* ---------- stage target layouts ---------- */
function buildTargets(stage) {
  const rnd = mulberry32(1009 * (stage + 3));
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const size = new Float32Array(N), role = new Float32Array(N);
  const put = (i, x, y, z, r, g, b, s, ro = 0) => {
    const k = i * 3;
    pos[k] = x; pos[k + 1] = y; pos[k + 2] = z;
    col[k] = r; col[k + 1] = g; col[k + 2] = b;
    size[i] = s; role[i] = ro;
  };
  const sph = () => { const u = rnd() * 2 - 1, t = rnd() * TAU, s = Math.sqrt(1 - u * u); return [s * Math.cos(t), u, s * Math.sin(t)]; };
  const gau = () => Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(TAU * rnd());

  switch (stage) {
    case 0: { // Atoms: electron shells around scattered nuclei
      const A = 10, centers = [], bases = [];
      for (let a = 0; a < A; a++) {
        const d = sph(), r = 0.15 + rnd() * 1.0;
        centers.push([d[0] * r, d[1] * r * 0.65, d[2] * r]);
        const shells = [];
        for (let s = 0; s < 3; s++) { const n = norm(sph()); const e1 = norm(cross(n, sph())); shells.push([e1, cross(n, e1)]); }
        bases.push(shells);
      }
      const RAD = [0.09, 0.16, 0.24];
      const TINT = [[0.45, 0.9, 1], [0.7, 0.6, 1], [1, 0.5, 0.85]];
      for (let i = 0; i < N; i++) {
        const a = i % A, c = centers[a];
        if (rnd() < 0.05) {
          const d = sph(), q = 0.03 * Math.cbrt(rnd());
          put(i, c[0] + d[0] * q, c[1] + d[1] * q, c[2] + d[2] * q, 1, 0.62, 0.32, 1.8);
          continue;
        }
        const s = (rnd() * 3) | 0, R = RAD[s] * (0.92 + rnd() * 0.16), th = rnd() * TAU;
        const [e1, e2] = bases[a][s], cs = Math.cos(th) * R, sn = Math.sin(th) * R, T = TINT[s];
        put(i, c[0] + e1[0] * cs + e2[0] * sn, c[1] + e1[1] * cs + e2[1] * sn, c[2] + e1[2] * cs + e2[2] * sn, T[0], T[1], T[2], 0.9 + rnd() * 0.7);
      }
      break;
    }
    case 1: { // Shapes: nested icosahedron and dodecahedron, drawn on their edges
      const ico = [], dod = [], cube = [];
      for (const a of [-1, 1]) for (const b of [-PHI, PHI]) ico.push([0, a, b], [a, b, 0], [b, 0, a]);
      for (const a of [-1, 1]) for (const b of [-1, 1]) for (const c of [-1, 1]) cube.push([a, b, c]);
      for (const a of [-1, 1]) for (const b of [-1, 1]) dod.push([0, a / PHI, b * PHI], [a / PHI, b * PHI, 0], [b * PHI, 0, a / PHI]);
      dod.push(...cube);
      const prep = (V, R) => { const Vn = V.map((v) => norm(v).map((x) => x * R)); return { V: Vn, E: edgesOf(Vn) }; };
      const A = prep(ico, 1.0), B = prep(dod, 0.72);
      for (let i = 0; i < N; i++) {
        const isA = rnd() < 0.6, S = isA ? A : B;
        if (rnd() < 0.06) {
          const v = S.V[(rnd() * S.V.length) | 0];
          put(i, v[0], v[1], v[2], 1, 0.95, 0.85, 2.2);
          continue;
        }
        const e = S.E[(rnd() * S.E.length) | 0], p = lerp(S.V[e[0]], S.V[e[1]], rnd());
        const C = isA ? [1, 0.82, 0.42] : [0.45, 0.9, 1];
        put(i, p[0] + gau() * 0.006, p[1] + gau() * 0.006, p[2] + gau() * 0.006, C[0], C[1], C[2], 0.9 + rnd() * 0.5);
      }
      break;
    }
    case 2: { // Galaxies: three logarithmic spiral arms and a warm core
      for (let i = 0; i < N; i++) {
        if (rnd() < 0.1) {
          const d = sph(), q = 0.17 * Math.pow(rnd(), 0.6);
          put(i, d[0] * q, d[1] * q * 0.45, d[2] * q, 1, 0.86, 0.6, 1.5);
          continue;
        }
        const arm = i % 3, r = 0.1 + 1.15 * Math.pow(rnd(), 0.85);
        const th = arm * TAU / 3 + 3.0 * Math.log(1 + r * 5) + gau() * 0.2 * (0.25 + r);
        const t = Math.min(1, r / 1.2);
        let c = [0.95 - 0.45 * t, 0.9 - 0.25 * t, 1.0];
        if (rnd() < 0.07) c = [1, 0.42, 0.62];
        put(i, r * Math.cos(th), gau() * 0.018 * (1.1 - r * 0.6), r * Math.sin(th), c[0], c[1], c[2], 0.8 + rnd() * 0.9);
      }
      break;
    }
    case 3: { // The Universe: halos joined by filaments
      const H = 56, hc = [];
      for (let h = 0; h < H; h++) { const d = sph(), r = 1.15 * Math.cbrt(rnd()); hc.push([d[0] * r, d[1] * r, d[2] * r]); }
      const nb = hc.map((p, i) => hc.map((q, j) => ({ j, d: dist(p, q) })).filter((o) => o.j !== i).sort((a, b) => a.d - b.d).slice(0, 3).map((o) => o.j));
      for (let i = 0; i < N; i++) {
        if (rnd() < 0.6) {
          const h = (rnd() * H) | 0, n = nb[h][(rnd() * 3) | 0], p = lerp(hc[h], hc[n], rnd());
          const c = rnd() < 0.4 ? [0.45, 0.7, 1] : [0.66, 0.5, 1];
          put(i, p[0] + gau() * 0.01, p[1] + gau() * 0.01, p[2] + gau() * 0.01, c[0], c[1], c[2], 0.6 + rnd() * 0.4);
        } else {
          const h = (rnd() * H) | 0, d = sph(), q = Math.abs(gau()) * 0.1, p = hc[h];
          put(i, p[0] + d[0] * q, p[1] + d[1] * q, p[2] + d[2] * q, 1, 0.93, 0.98, 1.0 + rnd() * 0.9);
        }
      }
      break;
    }
    case 4: { // Civilizations: a glowing planet with settlements and trade routes
      const K = 72, cs = [];
      for (let c = 0; c < K; c++) cs.push(norm(sph()));
      const nb = cs.map((p, i) => cs.map((q, j) => ({ j, d: dot(p, q) })).filter((o) => o.j !== i).sort((a, b) => b.d - a.d).slice(0, 3).map((o) => o.j));
      for (let i = 0; i < N; i++) {
        const g = rnd();
        if (g < 0.3) {
          const c = cs[(rnd() * K) | 0], d = sph(), r = 0.02 + 0.1 * rnd() * rnd();
          const p = norm([c[0] + d[0] * r, c[1] + d[1] * r, c[2] + d[2] * r]);
          put(i, p[0], p[1], p[2], 1, 0.78, 0.38, 1.3 + rnd() * 0.8);
        } else if (g < 0.7) {
          const c = (rnd() * K) | 0, n = nb[c][(rnd() * 3) | 0], p = norm(lerp(cs[c], cs[n], rnd()));
          put(i, p[0] * 1.01, p[1] * 1.01, p[2] * 1.01, 0.45, 0.9, 1, 0.7);
        } else {
          const d = sph();
          put(i, d[0] * 0.97, d[1] * 0.97, d[2] * 0.97, 0.22, 0.36, 0.9, 0.7 + rnd() * 0.4);
        }
      }
      break;
    }
    default: { // Cities: a dense district with streets and traffic
      const G = 20, cell = 2 / G, hgt = [], base = -0.3;
      for (let gx = 0; gx < G; gx++) for (let gz = 0; gz < G; gz++) {
        const x = -1 + (gx + 0.5) * cell, z = -1 + (gz + 0.5) * cell, fall = Math.exp(-(x * x + z * z) * 1.3);
        hgt[gx * G + gz] = 0.03 + Math.pow(rnd(), 2.2) * 0.55 * fall + 0.04 * rnd() * fall;
      }
      for (let i = 0; i < N; i++) {
        const g = rnd();
        if (g < 0.12) {
          const horiz = rnd() < 0.5, line = -1 + ((rnd() * (G + 1)) | 0) * cell, along = -1 + rnd() * 2;
          const c = rnd() < 0.5 ? [1, 0.75, 0.4] : [0.5, 0.9, 1];
          put(i, horiz ? along : line, base + 0.005, horiz ? line : along, c[0], c[1], c[2], 1.3, horiz ? 1 : 2);
          continue;
        }
        if (g < 0.2) {
          const horiz = rnd() < 0.5, line = -1 + ((rnd() * (G + 1)) | 0) * cell, along = -1 + rnd() * 2;
          put(i, horiz ? along : line, base, horiz ? line : along, 0.3, 0.36, 0.55, 0.5);
          continue;
        }
        const gx = (rnd() * G) | 0, gz = (rnd() * G) | 0, h = hgt[gx * G + gz];
        const x0 = -1 + gx * cell, z0 = -1 + gz * cell;
        if (rnd() < 0.45) {
          put(i, x0 + cell * (0.08 + 0.84 * rnd()), base + h, z0 + cell * (0.08 + 0.84 * rnd()), 1, 0.9, 0.62, 0.9 + rnd() * 0.6);
        } else {
          const cx = rnd() < 0.5 ? x0 + cell * 0.08 : x0 + cell * 0.92;
          const cz = rnd() < 0.5 ? z0 + cell * 0.08 : z0 + cell * 0.92;
          put(i, cx, base + rnd() * h, cz, 0.5, 0.9, 1, 0.8);
        }
      }
    }
  }
  return { pos, col, size, role };
}

/* ---------- WebGL setup ---------- */
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, powerPreference: 'high-performance' });
if (!gl) {
  showError('This page needs WebGL 2. Try a current Chrome, Edge, Firefox or Safari.');
  return;
}

const VS = `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aCol;
in float aSize;
in float aRole;
in float aSeed;
uniform float uTime, uAspect, uFit, uDpr, uDepth, uFov, uTilt;
uniform float uBass, uHigh, uBeat, uSpin, uDiff;
out vec3 vCol;
void main() {
  vec3 p = aPos;
  float j = uHigh * 0.014;
  p += j * vec3(sin(uTime * 7.0 + aSeed * 40.0), cos(uTime * 6.1 + aSeed * 23.0), sin(uTime * 5.3 + aSeed * 11.0));
  float r = length(p.xz) + 0.25;
  float a = uSpin * uDiff / r;
  float ca = cos(a), sa = sin(a);
  p.xz = mat2(ca, sa, -sa, ca) * p.xz;
  if (aRole > 1.5) { p.z = mod(p.z + uTime * 0.35 + 1.0, 2.0) - 1.0; }
  else if (aRole > 0.5) { p.x = mod(p.x + uTime * 0.35 + 1.0, 2.0) - 1.0; }
  float yaw = uTime * 0.05;
  float cy = cos(yaw), sy = sin(yaw);
  p.xz = mat2(cy, sy, -sy, cy) * p.xz;
  float ct = cos(uTilt), st = sin(uTilt);
  p.yz = mat2(ct, st, -st, ct) * p.yz;
  float w = uDepth - p.z;
  float sc = uFov * uFit / w;
  gl_Position = vec4(p.x * sc / uAspect, p.y * sc, 0.0, 1.0);
  gl_PointSize = aSize * 2.4 * uDpr * (uDepth / w) * (1.0 + 0.8 * uBass + 0.6 * uBeat);
  vCol = aCol * (0.85 + 0.3 * uBeat + 0.15 * uBass);
}`;

const FS = `#version 300 es
precision mediump float;
in vec3 vCol;
out vec4 o;
void main() {
  vec2 c = gl_PointCoord - 0.5;
  float d = dot(c, c) * 4.0;
  float a = exp(-d * 3.2);
  if (a < 0.02) discard;
  o = vec4(vCol * a * 0.6, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
try {
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
} catch (err) {
  showError('The visuals could not start: ' + err.message);
  throw err;
}
gl.useProgram(prog);
const U = {};
['uTime', 'uAspect', 'uFit', 'uDpr', 'uDepth', 'uFov', 'uTilt', 'uBass', 'uHigh', 'uBeat', 'uSpin', 'uDiff']
  .forEach((n) => { U[n] = gl.getUniformLocation(prog, n); });
gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE);
gl.disable(gl.DEPTH_TEST);
gl.uniform1f(U.uDepth, 3.0);
gl.uniform1f(U.uFov, 2.4);
gl.uniform1f(U.uTilt, 0.5);

/* ---------- particle state ---------- */
const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3);
const tgt = new Float32Array(N * 3), col = new Float32Array(N * 3), tcol = new Float32Array(N * 3);
const size = new Float32Array(N), role = new Float32Array(N), seed = new Float32Array(N);
col.fill(0.5); tcol.fill(0.5); size.fill(1);
for (let i = 0; i < N; i++) {
  seed[i] = Math.random();
  const u = Math.random() * 2 - 1, t = Math.random() * TAU, s = Math.sqrt(1 - u * u), r = 0.6 + Math.random() * 1.6;
  pos[i * 3] = s * Math.cos(t) * r; pos[i * 3 + 1] = u * r; pos[i * 3 + 2] = s * Math.sin(t) * r;
}

gl.bindVertexArray(gl.createVertexArray());
const bufs = {};
function bindAttr(name, data, comps) {
  const loc = gl.getAttribLocation(prog, name);
  const b = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, comps, gl.FLOAT, false, 0, 0);
  bufs[name] = { b, data };
}
function upload(name) {
  const { b, data } = bufs[name];
  gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
}
bindAttr('aPos', pos, 3);
bindAttr('aCol', col, 3);
bindAttr('aSize', size, 1);
bindAttr('aRole', role, 1);
bindAttr('aSeed', seed, 1);

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform1f(U.uDpr, dpr);
}
window.addEventListener('resize', resize);
resize();

/* ---------- stages ---------- */
let stageIdx = -1;
let capTimer = 0;
function showCaption(i) {
  captionEl.querySelector('b').textContent = STAGES[i];
  captionEl.querySelector('span').textContent = (i + 1) + ' of ' + STAGES.length;
  captionEl.classList.add('on');
  clearTimeout(capTimer);
  capTimer = setTimeout(() => captionEl.classList.remove('on'), 4500);
}
STAGES.forEach((name) => { const li = document.createElement('li'); li.textContent = name; stageList.appendChild(li); });
function markStage(i) {
  [...stageList.children].forEach((li, k) => { li.classList.toggle('on', k === i); li.classList.toggle('done', k < i); });
}
function setStage(i) {
  stageIdx = i;
  const T = buildTargets(i);
  tgt.set(T.pos); tcol.set(T.col); size.set(T.size); role.set(T.role);
  upload('aSize'); upload('aRole');
  showCaption(i);
  markStage(i);
}

/* ---------- audio ---------- */
const audio = new Audio();
audio.preload = 'auto';
let ac = null, analyser = null, freq = null, wave = null, audioReady = false;
function initAudio() {
  if (audioReady) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return false;
  ac = new AC();
  const src = ac.createMediaElementSource(audio);
  analyser = ac.createAnalyser();
  analyser.fftSize = 1024;
  analyser.smoothingTimeConstant = 0.55;
  src.connect(analyser);
  analyser.connect(ac.destination);
  freq = new Uint8Array(analyser.frequencyBinCount);
  wave = new Float32Array(analyser.fftSize);
  audioReady = true;
  return true;
}
function syncToggle() {
  toggleBtn.textContent = audio.paused ? '▶' : '❚❚';
  toggleBtn.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
}
function loadTrack(track, btn) {
  if (!initAudio()) showHint('This browser cannot analyse audio, so the stages will not advance.');
  if (ac && ac.state === 'suspended') ac.resume();
  audio.src = track.src;
  audio.play().catch((err) => showHint('Playback was blocked (' + err.message + '). Press play to start.'));
  nowEl.textContent = track.title;
  creditEl.textContent = track.credit;
  hint.hidden = true;
  toggleBtn.disabled = false;
  tracksEl.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn));
  syncToggle();
}
function togglePlay() {
  if (!audio.src) return;
  if (ac && ac.state === 'suspended') ac.resume();
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
}
TRACKS.forEach((tr) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = tr.short;
  b.addEventListener('click', () => loadTrack(tr, b));
  tracksEl.appendChild(b);
});
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (f) loadTrack({ title: f.name.replace(/\.[^.]+$/, ''), src: URL.createObjectURL(f), credit: 'Your file. It stays in this browser.' }, null);
  fileInput.value = '';
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) loadTrack({ title: f.name.replace(/\.[^.]+$/, ''), src: URL.createObjectURL(f), credit: 'Your file. It stays in this browser.' }, null);
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLInputElement)) {
    e.preventDefault();
    togglePlay();
  }
});
toggleBtn.addEventListener('click', togglePlay);
audio.addEventListener('play', syncToggle);
audio.addEventListener('pause', syncToggle);
audio.addEventListener('ended', syncToggle);
audio.addEventListener('error', () => { if (audio.getAttribute('src')) showHint('That file did not load. Try another track.'); });

/* ---------- analysis, progression, physics ---------- */
let bass = 0, mid = 0, high = 0, energy = 0, bassAvg = 0, beat = 0, lastBeat = -9;
let pkB = 0, pkM = 0, pkH = 0;
let progress = 0, spin = 0, diffCur = 0;

function kick(s) {
  const f = 0.55 * s, n = N * 3;
  for (let k = 0; k < n; k++) vel[k] += pos[k] * f;
}
function analyse(dt, t, playing) {
  let b = 0, m = 0, h = 0;
  if (playing && analyser) {
    analyser.getByteFrequencyData(freq);
    const avg = (a, z) => { let s = 0; for (let i = a; i < z; i++) s += freq[i]; return s / ((z - a) * 255); };
    b = avg(1, 7);
    m = avg(7, 40);
    h = avg(40, 200);
  }
  // Automatic gain: each band is measured against its own slowly decaying peak,
  // so quiet recordings and loud ones both use the full range.
  const dec = Math.exp(-dt * 0.05);
  pkB = Math.max(b, pkB * dec); pkM = Math.max(m, pkM * dec); pkH = Math.max(h, pkH * dec);
  b = Math.min(1, b / Math.max(pkB, 0.15));
  m = Math.min(1, m / Math.max(pkM, 0.15));
  h = Math.min(1, h / Math.max(pkH, 0.15));
  const k = Math.min(1, dt * 14);
  bass += (b - bass) * k; mid += (m - mid) * k; high += (h - high) * k;
  // Energy follows absolute loudness (RMS in dBFS), so quiet passages really are quiet.
  let target = 0;
  if (playing && analyser) {
    analyser.getFloatTimeDomainData(wave);
    let sum = 0;
    for (let i = 0; i < wave.length; i++) sum += wave[i] * wave[i];
    const db = 10 * Math.log10(Math.max(sum / wave.length, 1e-12));
    target = Math.min(1, Math.max(0, (db + 44) / 22));
  }
  energy += (target - energy) * Math.min(1, dt * 1.2);
  const loud = 0.5 * bass + 0.3 * mid + 0.2 * high;
  bassAvg += (bass - bassAvg) * Math.min(1, dt * 2);
  if (playing && bass > bassAvg * 1.3 + 0.06 && t - lastBeat > 0.22) {
    lastBeat = t; beat = 1;
    kick(Math.min(1, (bass - bassAvg) * 3));
  }
  beat = Math.max(0, beat - dt * 3.5);
}
function physics(dt) {
  const n = N * 3, cl = Math.min(1, dt * 2.5);
  for (let k = 0; k < n; k++) {
    const v = vel[k] + ((tgt[k] - pos[k]) * SPRING - vel[k] * DAMP) * dt;
    vel[k] = v;
    pos[k] += v * dt;
    col[k] += (tcol[k] - col[k]) * cl;
  }
}

/* ---------- frame loop ---------- */
let last = performance.now();
const t0 = last;
function frame(now) {
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000));
  last = now;
  const t = (now - t0) / 1000;
  const playing = !audio.paused && !audio.ended;

  analyse(dt, t, playing);
  if (playing && audio.readyState >= 2) progress = Math.min(6, progress + dt * (0.008 + 0.045 * energy * energy));
  const idx = Math.min(5, Math.floor(progress));
  if (idx !== stageIdx) setStage(idx);
  fillEl.style.width = (progress / 6 * 100).toFixed(2) + '%';

  spin += dt * (0.25 + bass * 1.2);
  const diffTarget = stageIdx === 2 ? 1 : stageIdx === 3 ? 0.35 : 0;
  diffCur += (diffTarget - diffCur) * Math.min(1, dt * 1.5);

  physics(dt);
  upload('aPos');
  upload('aCol');

  gl.clearColor(0.012, 0.014, 0.03, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uBass, bass);
  gl.uniform1f(U.uHigh, high);
  gl.uniform1f(U.uBeat, beat);
  gl.uniform1f(U.uSpin, spin);
  gl.uniform1f(U.uDiff, diffCur);
  gl.uniform1f(U.uAspect, canvas.width / canvas.height);
  gl.uniform1f(U.uFit, Math.min(1, canvas.width / canvas.height));
  gl.drawArrays(gl.POINTS, 0, N);
  requestAnimationFrame(frame);
}

window.atomsDebug = () => ({ progress: +progress.toFixed(3), stage: stageIdx, energy: +energy.toFixed(3), bass: +bass.toFixed(3), playing: !audio.paused });

const m = location.hash.match(/stage=(\d)/);
if (m) progress = Math.min(5, +m[1]) + 0.5;
setStage(Math.min(5, Math.floor(progress)));
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
