<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atoms to Cities</title>
<meta name="description" content="A music-driven journey from atoms to the streets of a city. The song sets the pace.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="curtain" aria-hidden="true"></div>

<header class="top">
  <h1>Atoms to Cities</h1>
</header>

<p id="hint" class="hint">Pick a track below, or drop an MP3 anywhere on the page.</p>
<p id="nogl" class="hint err" hidden></p>

<section class="dock" aria-label="Music and story controls">
  <div id="meter" class="meter" role="slider" tabindex="0" aria-label="Story progress. Click to seek." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="fill"></div>
  </div>
  <div class="row">
    <button id="toggle" class="round" type="button" aria-label="Play" disabled>&#9654;</button>
    <div class="now">
      <span id="now">No track yet</span>
      <small id="credit"></small>
    </div>
    <div id="tracks" class="tracks">
      <label class="btn">Your MP3<input id="file" type="file" accept="audio/*"></label>
    </div>
  </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
